name: Continuous Integration & Code Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Code Quality, Strict Types & Test Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Analysis & Lint Verification
        run: npm run lint

      - name: Strict TypeScript Compilation
        run: npm run typecheck

      - name: Automated Physics & Domain Unit Tests (9 Suites)
        run: npm test

      - name: Production Bundle Compilation
        run: npm run build
